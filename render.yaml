services:
  - type: web
    name: chaukas
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: STT_PROVIDER
        value: auto
      - key: TTS_PROVIDER
        value: auto
      - key: LLM_ENABLED
        value: auto
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        value: "http://localhost:5173,https://*.onrender.com"
      - key: SARVAM_API_KEY
        sync: false
      - key: BOLNA_API_KEY
        sync: false
      - key: BOLNA_AGENT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

